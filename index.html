<style>
:root{--bg:#f3f2ee;--card:#fff;--fg:#1a1a1a;--muted:#6b6b66;--line:#e2e0da;--red:#c0392b;--red-soft:#f8e3e0;--ok:#2e7d4f;--ok-soft:#dff0e6;--dark:#2c2c2c;--input:#f7f6f3;
--display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--nav:62px}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--fg:#ecebe7;--muted:#9a9993;--line:#2e2e2c;--red:#e0563f;--red-soft:#3a1f1a;--ok:#58b07e;--ok-soft:#1a3326;--dark:#0b0b0b;--input:#252524;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
#root{max-width:640px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-left)) calc(var(--nav) + 90px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;font-weight:700}
.brand h1 b{color:var(--red)}
.sync{font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--red)}.sync.busy i{background:#d39b20}
.sub{display:flex;gap:4px;margin:10px 0 0;border-bottom:1px solid var(--line)}
.sub button{flex:1;background:none;border:0;padding:9px 4px;font-family:var(--display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.sub button.on{color:var(--fg);border-color:var(--red)}
.top .pad{height:8px}
nav.main{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.main button{flex:1;height:var(--nav);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
nav.main button svg{width:24px;height:24px}
nav.main button.on{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h2{margin:0 0 8px;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--input);font-size:16px}
textarea{resize:vertical;min-height:60px}
.seg{display:flex;margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px 4px;background:var(--input);border:0;border-left:1px solid var(--line);cursor:pointer;line-height:1.15}
.seg button:first-child{border-left:0}
.seg button b{display:block;font-family:var(--display);font-size:20px}
.seg button span{font-size:11px;color:var(--muted)}
.seg button.on{background:var(--dark);color:#fff}.seg button.on span{color:#cfcfcf}
.phase{margin:12px 0 0;font-family:var(--display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--red)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.banner{background:var(--red-soft);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px}
.banner button{background:none;border:0;text-decoration:underline;padding:0;cursor:pointer;font-weight:600}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.ex.main{border-left:4px solid var(--red)}
.ex header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px 0}
.ex h3{margin:0;font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.presc{text-align:right;font-family:var(--display);font-weight:700;font-size:17px;color:var(--red);flex-shrink:0;max-width:50%}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 14px 0;font-size:12.5px;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:var(--input);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.last{margin:8px 14px 0;font-size:12.5px;color:var(--muted)}.last b{color:var(--fg);font-weight:600}
.sets{padding:8px 14px 0}
.set,.colh{display:grid;grid-template-columns:22px 1fr 16px 1fr;align-items:center;gap:6px}
.set{margin:6px 0}
.set .n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.set .x{text-align:center;color:var(--muted)}
.set input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--input);font-size:16px;text-align:center}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px}
.colh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 14px 0}
.colh span{text-align:center}
.setbtns{display:flex;gap:8px;padding:6px 14px 12px}
.setbtns button,.ghost{background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.save{display:block;width:100%;padding:15px;margin:16px 0;background:var(--red);color:#fff;border:0;border-radius:12px;font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.save.sm{font-size:16px;padding:12px;margin:10px 0 0}
.save:disabled{opacity:.6}
details.leg{font-size:13px;color:var(--muted);margin:8px 0}
details.leg summary{cursor:pointer;font-weight:600}
details.leg p,details.leg li{margin:6px 0}
details.leg ul{padding-left:18px;margin:6px 0}
.sess{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
.sess summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sess summary::-webkit-details-marker{display:none}
.sess summary b{font-family:var(--display);font-size:17px;text-transform:uppercase}
.sess summary span{font-size:12.5px;color:var(--muted)}
.sess .body{padding:0 14px 12px;font-size:14px}
.sess .body p{margin:6px 0}.sess .body .en{font-weight:600}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--input);cursor:pointer;font-size:14px}
.acts button.danger{color:var(--red);border-color:var(--red)}
.acts button.danger.arm{background:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat b{font-family:var(--display);font-size:24px}
.stat i{font-style:normal;font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.prs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.prs button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.prs button.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.prs small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.prs b{font-family:var(--display);font-size:20px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.bar.ok i{background:var(--ok)}
/* corsa */
.rph{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:14px;margin:22px 0 6px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.wk.now{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.wkh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wkh b{font-family:var(--display);font-size:19px;text-transform:uppercase}
.wkh span{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--red-soft)}
.run{border-top:1px solid var(--line);padding:9px 0 8px}
.run:first-of-type{border-top:0}
.rl{display:flex;gap:10px;align-items:flex-start}
.chk{width:26px;height:26px;flex:none;border-radius:7px;border:2px solid var(--line);background:var(--input);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#fff;font-size:16px;line-height:1}
.chk.on{background:var(--ok);border-color:var(--ok)}
.rt{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.rt b{display:block;font-weight:600}
.rt span{color:var(--muted);font-size:13.5px}
.done .rt b{text-decoration:line-through;color:var(--muted)}
.rlog{font-size:12.5px;color:var(--ok);margin:4px 0 0 36px;font-weight:600}
.rform{margin:8px 0 2px 36px}
.rform .row{gap:8px}
.wnote{font-size:12.5px;color:var(--muted);margin-top:6px}
/* settimana */
.day{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dn{width:46px;flex:none;font-family:var(--display);font-weight:700;text-transform:uppercase;color:var(--muted);line-height:1.1}
.day .dn b{display:block;font-size:20px;color:var(--fg)}
.day.today .dn,.day.today .dn b{color:var(--red)}
.pill{display:inline-block;font-size:13px;padding:3px 9px;border-radius:99px;margin:2px 4px 2px 0;background:var(--input);border:1px solid var(--line)}
.pill.g{background:var(--red-soft);border-color:transparent}
.pill.r{background:var(--ok-soft);border-color:transparent}
.todo li{margin:5px 0}
#tbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:9;background:var(--dark);color:#fff;display:none;align-items:center;justify-content:center;gap:16px;padding:10px 16px}
#tbar.on{display:flex}
#tbar b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;min-width:90px;text-align:center}
#tbar button{background:#444;border:0;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 80px + env(safe-area-inset-bottom));z-index:10;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%;display:none;text-align:center}
#toast.on{display:block}
ol.steps{padding-left:20px;margin:6px 0;font-size:14px}
ol.steps li{margin:6px 0}
code{background:var(--input);padding:1px 5px;border-radius:4px;font-size:13px}
</style>
</head>

  arr.forEach(function(x){var k=tot(id,x.kg);if(k!=null&&(top==null||k>top)){top=k;topSet=x}var e=k==null?null:e1rm(k,x.reps);if(e!=null&&(best==null||e>best))best=e});
  if(top!=null||best!=null)out.push({date:s.date,week:s.week,top:top,topSet:topSet,e:best})});

 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),pad=Math.max(2.5,(mx-mn)*0.12);mn=Math.max(0,Math.floor((mn-pad)/2.5)*2.5);mx=Math.ceil((mx+pad)/2.5)*2.5;

 var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento">';
 for(var i=0;i<=3;i++){var v=mn+(mx-mn)*i/3,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" opacity=".12"/><text x="'+(L-6)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="currentColor" opacity=".6">'+Math.round(v)+'</text>'}

 if(a==="cfgOff"){cfg={url:"",key:""};ls("all-sync",null);setSync("off");render();return}
 if(a==="copy"){try{navigator.clipboard.writeText(JSON.stringify(st,null,1)).then(function(){toast("Dati copiati")},function(){toast("Copia non riuscita")})}catch(e){toast("Copia non disponibile")}return}
 if(a==="import"){try{var j=JSON.parse($("#imp").value);var before=st.sessions.length;st=merge(st,j);commit();toast("Importate "+(st.sessions.length-before)+" sedute nuove");render()}catch(e){toast("JSON non valido")}return}
});
document.addEventListener("input",function(ev){
 var t=ev.target;
 if(t.dataset.k){var id=t.closest("[data-ex]").dataset.ex,i=+t.dataset.i;draft.ex[id][i][t.dataset.k]=t.value.trim();saveDraft();return}
 var f=t.dataset.f;if(f==="bw"||f==="note"){draft[f]=t.value;saveDraft()}
});
document.addEventListener("change",function(ev){
 var t=ev.target,f=t.dataset.f;if(!f)return;
 if(f==="date"){draft.date=t.value||todayISO();if(!draft.id&&st.startDate){draft.week=autoWeek(draft.date);draft.ex=buildEx(draft.week,draft.day,draft.ex)}saveDraft();render()}
 else if(f==="week"){draft.week=parseInt(t.value,10);draft.ex=buildEx(draft.week,draft.day,draft.ex);saveDraft();render()}
 else if(f==="progEx"){progEx=t.value;render()}
});
function doSave(){
 var ex={},any=false;
 exList(draft.week,draft.day).forEach(function(x){var arr=(draft.ex[x.e.id]||[]).filter(function(s){return s.kg!==""||s.reps!==""});if(arr.length){ex[x.e.id]=arr;any=true}});
 if(!any){toast("Inserisci almeno una serie prima di salvare.");return}
 var now=Date.now(),old=draft.id&&st.sessions.filter(function(s){return s.id===draft.id})[0];
 var sess={id:draft.id||uid(),date:draft.date,week:draft.week,day:draft.day,bw:String(draft.bw||"").trim(),note:String(draft.note||"").trim(),ex:ex,savedAt:old?old.savedAt:now,updatedAt:now};
 st.sessions=st.sessions.filter(function(s){return s.id!==sess.id}).concat([sess]);
 commit();ls("all-draft",null);draft=newDraft();toast(old?"Seduta aggiornata":"Seduta salvata 💪");render();window.scrollTo(0,0);
}

/* ================= AVVIO ================= */
render();
if(cfg.url)syncNow();
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&cfg.url)syncNow()});
window.addEventListener("online",function(){if(cfg.url)syncNow()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
